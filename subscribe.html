  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; padding: 3rem 1rem;
    }
    .container { max-width: 480px; width: 100%; text-align: center; }
    .logo { font-size: 1.5rem; font-weight: 800; margin-bottom: .5rem;
      background: linear-gradient(135deg, #f59e0b, #ef4444, #8b5cf6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: .75rem; line-height: 1.2; }
    p { color: #94a3b8; font-size: 1rem; margin-bottom: 2rem; line-height: 1.6; }
    form { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1.5rem; text-align: left; }
    label { display: block; font-size: .82rem; font-weight: 600; color: #cbd5e1; margin-bottom: .35rem; }
    input[type="email"], input[type="text"] {
      width: 100%; padding: .6rem .75rem; border-radius: 8px; border: 1px solid #334155;
      background: #0f172a; color: #f8fafc; font-size: .95rem; margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: #f59e0b; }
    .checkbox { display: flex; align-items: flex-start; gap: .5rem; font-size: .82rem; color: #94a3b8; margin-bottom: 1.25rem; }
    .checkbox input { margin-top: .15rem; }
    button {
      width: 100%; padding: .8rem; border: none; border-radius: 8px;
      background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff;
      font-weight: 700; font-size: 1rem; cursor: pointer; transition: transform .15s;
    }
    button:hover { transform: translateY(-2px); }
    .footer { margin-top: 2rem; font-size: .78rem; color: #64748b; }
    .footer a { color: #94a3b8; }
    .nav { margin-bottom: 2rem; }
    .nav a { color: #94a3b8; text-decoration: none; font-size: .88rem; margin: 0 .6rem; }
    .nav a:hover { color: #f59e0b; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/">← Home</a>
    <a href="/briefings.html">Briefings</a>
    <a href="/methodology.html">Methodology</a>
  </div>

  <div class="container">
    <div class="logo"><img src="/assets/logo_icon_raw.png" alt="" style="width:28px;height:28px;border-radius:6px;vertical-align:middle;margin-right:6px;">ChinaVol</div>
    <h1>Get the daily briefing</h1>
    <p>Free pre-market digest, delivered to your inbox before Asia opens. No spam. Unsubscribe anytime.</p>

    <!-- Replace action with your form backend (Buttondown, ConvertKit, Beehiiv, etc.) -->
    <form action="https://buttondown.com/api/emails/embed-subscribe/chinavol" method="post" target="_blank">
      <label for="email">Email address</label>
      <input type="email" name="email" id="email" placeholder="you@example.com" required>

      <label for="name">Name (optional)</label>
      <input type="text" name="metadata__name" id="name" placeholder="First name">

      <div class="checkbox">
        <input type="checkbox" id="consent" required>
        <label for="consent" style="font-weight:400; margin:0; font-size:.82rem; color:#94a3b8;">
          I agree to receive ChinaVol briefings and market alerts. Privacy policy applies.
        </label>
      </div>

      <button type="submit">Subscribe for free →</button>
    </form>

    <div class="footer">
      Want real-time alerts? → <a href="https://x.com/chinavol1" target="_blank">Follow @chinavol1 on 𝕏</a>
      <br><br>
      ChinaVol is fully free. Premium coming soon.
    </div>
  </div>

  <script>
    const form = document.querySelector('form');
    form.addEventListener('submit', function(e) {
      if (!document.getElementById('consent').checked) {
        e.preventDefault();
        alert('Please agree to receive briefings before subscribing.');
      }
    });
  </script>
</body>
</html>
