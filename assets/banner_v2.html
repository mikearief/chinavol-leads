<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>ChinaVol Twitter Banner</title></head>
<body style="background:#0a1628;margin:0;padding:0">
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" style="display:block">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
  </defs>
  <rect width="1500" height="500" fill="url(#bgGrad)"/>

  <!-- Icon -->
  <image href="logo_icon_raw.png" x="80" y="100" width="300" height="300"/>

  <!-- Wordmark: ChinaVol.com as one continuous block -->
  <text x="520" y="290" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="130" fill="#f59e0b" letter-spacing="-2">
    ChinaVol<tspan font-weight="900" font-size="130" fill="#f59e0b">.com</tspan>
  </text>

  <!-- Tagline -->
  <text x="520" y="365" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="24" fill="#94a3b8" letter-spacing="10" text-transform="uppercase">VOLATILITY INTELLIGENCE</text>
</svg>
</body>
</html>
